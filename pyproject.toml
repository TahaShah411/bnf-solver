[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bnf-solver"
version = "0.1.0"
description = "Parse BNF grammars and decide whether strings are derivable, with parse trees"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["bnf", "grammar", "parser", "earley", "context-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bnf-solver = "bnf_solver.cli:main"

[tool.setuptools]
packages = ["bnf_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
